# Воспроизводимость, проверяемая на каждом пуше:
#   test   — ruff + pytest (контракт ответа, каталог, поиск, pgvector на живой базе);
#   docker — сборка образа из чистого клона, запрос как у скрипта кейсодержателя,
#            точность на синтетике и тот же сервис с индексом в pgvector.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGVECTOR_DSN: postgresql://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Зависимости (torch с CPU-индекса, версии из constraints.txt)
        run: |
          pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -c constraints.txt
      - run: ruff check src tests scripts
      - run: pytest -p no:warnings

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Место под образ (~7 ГБ)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: docker compose build
      - run: docker compose up -d
      - name: Ждать прогрева (lifespan)
        run: |
          for i in $(seq 1 60); do
            curl -fsS localhost:8080/health && exit 0
            sleep 5
          done
          docker compose logs; exit 1
      - name: Запрос как у participant_test.sh — slug в корне, не null
        run: |
          photo=data/catalog_thumbs/oleg_repin_shenen_blan_beloe_suhoe_125_668dadcd2b.webp
          body=$(curl -fsS --max-time 10 -F image=@$photo localhost:8080/v1/eval/predict)
          echo "$body" | jq '{slug, confidence, confident, timings_ms}'
          echo "$body" | jq -e '.slug | type == "string" and length > 0'
          echo "$(printf 'garbage' | curl -fsS --max-time 10 -F image=@- localhost:8080/v1/eval/predict)" \
            | jq -e '.slug | type == "string" and length > 0'
      - name: Точность на синтетике из фото каталога (порог — ловушка регрессий)
        run: |
          docker compose exec -T scanner python scripts/make_synthetic.py --n 60 --out /tmp/synth
          docker compose exec -T scanner python scripts/evaluate.py \
            --labels /tmp/synth/labels.csv --url http://127.0.0.1:8080/scan \
            --out /tmp/errors.csv --min-top1 0.75 --sla 10000
      - name: Стек заказчика — индекс в PostgreSQL + pgvector
        run: |
          docker compose down
          docker compose -f docker-compose.yml -f docker-compose.pgvector.yml up -d
          for i in $(seq 1 60); do
            curl -fsS localhost:8080/health >/dev/null && break
            sleep 5
          done
          curl -fsS localhost:8080/health | jq -e '.index == "pgvector"'
          docker compose -f docker-compose.yml -f docker-compose.pgvector.yml exec -T scanner \
            python scripts/make_synthetic.py --n 30 --out /tmp/synth
          docker compose -f docker-compose.yml -f docker-compose.pgvector.yml exec -T scanner \
            python scripts/evaluate.py --labels /tmp/synth/labels.csv \
            --url http://127.0.0.1:8080/scan --out /tmp/errors.csv --min-top1 0.75 --sla 10000
      - if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.pgvector.yml logs

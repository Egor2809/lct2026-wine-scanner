# Веса сигналов, пороги и маппинг дампа. Всё, что подбирается замерами,
# живёт здесь, а не в коде — чтобы эксперимент был одной правкой YAML.

catalog:
  # Имена колонок дампа заранее неизвестны: заказчик обещал перевыгрузку.
  # Здесь — целевое поле -> список синонимов, поиск без учёта регистра.
  # Первое совпадение выигрывает. Достаточно дописать синоним, когда увидим дамп.
  columns:
    slug:        [slug, wine_slug, url_slug, code, handle]
    title:       [title, name, wine_name, название, наименование]
    winery:      [winery, producer, manufacturer, brand, винодельня, производитель]
    region:      [region, area, terroir, регион]
    grape:       [grape, grapes, variety, varietal, сорт, сорта]
    style:       [style, type, category, kind, тип, категория]
    color:       [color, wine_color, цвет]
    vintage:     [vintage, year, harvest_year, год, урожай]
    sugar:       [sugar, sweetness, сахар, сладость]
    description: [description, note, tasting_note, about, описание]
    pairing:     [pairing, food_pairing, gastronomy, гастрономия, сочетания]
    image:       [image, image_url, photo, picture, file, image_path, фото]
    url:         [url, link, page, permalink, ссылка]
  # Куда ведёт карточка портала, если в дампе нет колонки url.
  site_base_url: "https://vino-svoe.ru/wines"

embedder:
  # siglip    — SigLIP 2 base 384 (рекомендация ТЗ), рабочий режим.
  # histogram — цветовая гистограмма, нижний baseline без нейросети.
  kind: siglip
  histogram:
    bins: 8        # 8^3 = 512 измерений
    grid: 2        # изображение режется на grid x grid ячеек, гистограммы конкатенируются
  siglip:
    model_id: google/siglip2-base-patch16-384
    device: auto          # cuda -> mps -> cpu
    batch_size: 16
    max_side: 800         # предресайз перед процессором (он всё равно сожмёт до 384)
    # Потоки torch на CPU (на MPS/CUDA не влияет): оставляют ядра локальному OCR.
    threads: 2
    # LoRA-адаптер для фото запроса; пусто — базовая модель.
    lora_path: artifacts/models/siglip_lora_v2.pt

index:
  # numpy — точный косинусный поиск. На 2000 позиций это единицы миллисекунд,
  # ANN не нужен. faiss/pgvector оставлены как доказательство переносимости.
  kind: numpy
  top_k: 50           # сколько кандидатов уходит в ре-ранкинг
  return_k: 5         # сколько кандидатов попадает в ответ (нужно для top-5 F1)

normalize:
  max_side: 1600      # длинная сторона кадра запроса перед детекцией и OCR
  white_balance: true # «серый мир» для вида, который уходит в эмбеддер
  clahe:
    enabled: false    # на SigLIP замер не показал выигрыша
    clip_limit: 2.0
    tile_grid: 8
  # Кроп этикетки YOLOv8n (веса дообучены на полевых фото кейса).
  crop:
    enabled: true
    weights: artifacts/models/label_yolov8n.pt
    confidence: 0.25
    center_weight: 0.3  # штраф за удалённость рамки от центра: на полке снимают центральную
    margin: 0.08        # поля вокруг этикетки для эмбеддера
    ocr_margin: 0.15    # поля для OCR — название бывает над этикеткой

text:
  # rapid  — «в контуре» (по умолчанию): RapidOCR, PP-OCRv5 eslav на ONNX Runtime,
  #          CPU, любая ОС, без сети и платных API. Yandex не вызывается, даже если
  #          YANDEX_API_KEY задан.
  # auto   — Yandex OCR при наличии ключа, иначе/при сбое — локальный OCR
  #          (Apple Vision на macOS, RapidOCR на Linux/Windows). Опция, не по умолчанию.
  # yandex | apple | local | none
  kind: rapid
  max_side: 1600
  # RapidOCR: кроме кадра читать верх и низ этикетки, увеличенные в 1,6 раза
  # (мелкий шрифт). Три прохода параллельно. Полевые 59 -> 61/63 (29.09).
  rapid_tiles: true
  # Потоков ONNX на каждый из трёх проходов. На 4 ядрах (Docker --cpus=4)
  # 2 потока на проход + SigLIP на всех ядрах дерутся за CPU: 3 x 1 + 2 у SigLIP.
  rapid_threads: 1
  # SLA запроса 3 с. Облако укладывается в deadline вместе с повторами
  # (429/5xx/сеть), после trip_after сбоев подряд выключается на cooldown
  # секунд, и запросы сразу идут в запасной OCR (Apple Vision +0.3–0.8 c).
  # Обычный ответ облака 0.2–0.75 c; квота ~1 запрос/с -> min_interval.
  deadline: 1.6
  attempt_timeout: 1.2
  cooldown: 30
  trip_after: 2
  min_interval: 1.0
  # Жёсткий предел всей текстовой ветки от начала запроса. Не успела — ответ
  # только по картинке. 6 с (29.09): в Docker на 4 ядрах CPU RapidOCR в три
  # прохода идёт 3–5 с; при 2.4 с текст отваливался и top-1 падал до 81 %.
  # Точность важнее скорости (5 баллов из 100), лимит скрипта проверки — 10 с.
  budget: 6.0
  pool: 20            # сколько лучших по тексту позиций добавляется к визуальному пулу

fusion:
  # Веса сигналов слияния. Подобраны на полевых фото (scripts/eval_offline.py).
  # textual 0.6 (29.09): локальный RapidOCR шумнее облака, ему нужен вес выше —
  # «в контуре» полевые 58 -> 59/63, чистые 14 -> 15/15; Yandex на полевых
  # 61/63 при 0.4 и 0.6 одинаково (скрытая синтетика 278 -> 276/300).
  weights:
    visual: 1.0      # косинус SigLIP
    textual: 0.6     # F-мера совпадения OCR этикетки и карточки, 0..1
    geometric: 0.0

confidence:
  # Калибровка: python scripts/calibrate.py (полевые фото в каталоге и вне его).
  # temperature — softmax по слитым скорам; вероятности карточек одного вина
  # (близнецы, другие винтажи) складываются.
  temperature: 0.01
  threshold: 0.5
  # Абсолютная проверка «вино вообще есть в каталоге»: visual + text_weight*text.
  # 0.6 -> 56/63 вин каталога показываются сразу карточкой (25.09), вина вне каталога
  # ошибочно «уверенны» в 11/37 (без неё — 28/37). Шкала visual зависит от
  # LoRA: при смене адаптера перекалибровать.
  absolute:
    text_weight: 0.5
    threshold: 0.6
  # Второй путь к «уверенно»: на этикетке прочитано редкое собственное
  # название вина (title без винодельни). Спасает вина, чей эталон — скриншот
  # с другим светом («Олег», «Цитронный Магарача»: visual 0.17–0.25).
  # Полевые 25.09: верных уверенно 54 -> 58 из 61, вне каталога — 11/37 без
  # изменений (плато recall 0.55–0.7; ближайшее вино вне каталога — Alveus, 0.53).
  # min_idf — IDF самого редкого слова названия: «Мерло» 2.4 и «Шардоне Резерв»
  # 3.2 не опознают вино, «Олег» 5.1 и «Цитронный» 5.3 — да. Известный риск:
  # латинское написание сорта редко в каталоге («chardonay» 4.4 против
  # «shardone» 1.9), и вино вне каталога с этикеткой «CHARDONNAY» может стать
  # уверенным. Исключать сорта нельзя: у «Олега» сорт и есть название.
  name:
    recall: 0.6
    min_idf: 4.0
  # «confident» — только сигнал для UI (карточка или экран вариантов).
  # На оценочном прогоне НЕ применяется: сервис всегда отдаёт лучший slug.

enrich:
  analogs_count: 4
